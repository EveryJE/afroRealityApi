plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'afroRealityApi'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Web ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Mail ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // --- Database / JPA ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // --- Security + OAuth2 (Google/Microsoft/Facebook login) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // --- JWT (issuing your own tokens after login) ---
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- AWS S3 SDK (works with Cloudflare R2, S3-compatible) ---
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'

    // --- Image processing (WebP conversion) ---
    implementation 'com.sksamuel.scrimage:scrimage-core:4.1.3'
    implementation 'com.sksamuel.scrimage:scrimage-webp:4.1.3'

    // --- Dev productivity ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // --- Monitoring ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- API docs (Swagger UI) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(17)
            }
            imageName = 'afrorealityapi'
            buildArgs.add('-O2')
            buildArgs.add('--no-fallback')
            buildArgs.add('-H:+ReportExceptionStackTraces')
            buildArgs.add('--trace-class-initialization=org.apache.commons.logging.LogFactory,org.apache.logging.log4j.util.Strings,org.apache.logging.log4j.util.OsgiServiceLocator,org.slf4j.MarkerFactory,org.apache.logging.log4j.util.PropertyFilePropertySource,org.springframework.core.SpringProperties,org.apache.commons.logging.impl.Slf4jLogFactory,org.apache.logging.log4j.spi.Provider,org.apache.commons.logging.impl.Slf4jLogFactory$Slf4jLocationAwareLog,org.apache.logging.log4j.util.PropertiesUtil,org.apache.logging.log4j.util.StackLocator,org.slf4j.helpers.Reporter,org.apache.logging.log4j.Level,org.apache.logging.log4j.status.StatusLogger$Config,org.apache.logging.log4j.util.StackLocatorUtil,org.apache.logging.log4j.util.PropertySource$Util,org.apache.logging.log4j.spi.AbstractLogger,org.apache.logging.log4j.status.StatusLogger$InstanceHolder,org.slf4j.LoggerFactory,org.apache.logging.log4j.util.LoaderUtil,org.apache.logging.log4j.spi.StandardLevel,org.apache.logging.log4j.status.StatusLogger')
            buildArgs.add('--initialize-at-build-time=org.slf4j.helpers.Reporter,org.apache.logging.log4j.Level,org.springframework.core.SpringProperties,org.apache.logging.log4j.status.StatusLogger,org.apache.commons.logging.impl.Slf4jLogFactory,org.apache.logging.log4j.status.StatusLogger$InstanceHolder,org.apache.logging.log4j.util.LoaderUtil,org.apache.logging.log4j.spi.StandardLevel,org.slf4j.LoggerFactory,org.apache.commons.logging.impl.Slf4jLogFactory$Slf4jLocationAwareLog,org.apache.logging.log4j.util.PropertiesUtil,org.apache.logging.log4j.status.StatusLogger$Config,org.apache.logging.log4j.util.Strings,org.slf4j.MarkerFactory,org.apache.logging.log4j.util.PropertySource$Util,org.apache.logging.log4j.spi.Provider,org.apache.logging.log4j.util.StackLocatorUtil,org.apache.logging.log4j.spi.AbstractLogger,org.apache.logging.log4j.util.PropertyFilePropertySource,org.apache.logging.log4j.util.OsgiServiceLocator,org.apache.commons.logging.LogFactory,org.apache.logging.log4j.util.StackLocator')
        }
    }
}