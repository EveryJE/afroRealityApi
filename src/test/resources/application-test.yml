spring:
  datasource:
    url: jdbc:h2:mem:afroreality;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  base-url: http://localhost:8080
  frontend-url: http://localhost:3000
  local-upload-path: /uploads
  jwt:
    secret: test-secret
    expiration-ms: 86400000
    email-token-expiration-ms: 86400000
  brevo:
    api-key:
    sender-email: noreply@example.com
    sender-name: AfroReality
  paystack:
    secret-key:
  r2:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket-name: afroreality
    public-url-prefix: http://localhost:9000
