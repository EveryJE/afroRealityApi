spring:
  application:
    name: afroRealityApi
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${SPRING_DB_URL:jdbc:postgresql://localhost:5432/afroreality}
    username: ${SPRING_DB_USERNAME:postgres}
    password: ${SPRING_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:change-me}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:local-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:local-facebook-client-secret}
            scope:
              - email
              - public_profile
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:local-microsoft-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:local-microsoft-client-secret}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/v1.0/me
            user-name-attribute: displayName

app:
  base-url: ${BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  local-upload-path: /uploads
  jwt:
    secret: ${JWT_SECRET:change-me-please}
    expiration-ms: 86400000
    email-token-expiration-ms: 86400000
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:noreply@example.com}
    sender-name: ${BREVO_SENDER_NAME:AfroReality}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  r2:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key: ${R2_ACCESS_KEY:local-access-key}
    secret-key: ${R2_SECRET_KEY:local-secret-key}
    bucket-name: ${R2_BUCKET_NAME:afroreality}
    public-url-prefix: ${R2_PUBLIC_URL_PREFIX:http://localhost:9000}
